[package]
default-run = "tarkov-companion-rust"
name = "tarkov-companion-rust"
version = "2.13.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Local-first Escape from Tarkov companion desktop host"

[lib]
name = "tarkov_companion_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
staged-updates = ["dep:tauri-plugin-updater", "dep:base64", "dep:minisign-verify"]

[build-dependencies]
base64 = "0.23"
minisign-verify = "0.3"
tauri-build = { version = "2", features = [] }

[dependencies]
semver = "1"
base64 = { version = "0.23", optional = true }
minisign-verify = { version = "0.3", optional = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
stash-core = { path = "../crates/stash-core" }
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync"] }
notify = "8"
encoding_rs = "0.8"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "native-tls", "system-proxy"] }
tauri-plugin-updater = { version = "2", optional = true, default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[[bin]]
name = "prepare-update"
path = "src/bin/prepare-update.rs"
required-features = ["staged-updates"]
