[package]
name = "tarkov-companion-rust"
version = "2.13.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Local-first Escape from Tarkov companion desktop host"

[lib]
name = "tarkov_companion_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
stash-core = { path = "../crates/stash-core" }
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
