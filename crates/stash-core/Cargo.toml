[package]
name = "stash-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Local inventory transactions and conservative requirement allocation"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

