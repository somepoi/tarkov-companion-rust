# Staging only: publishing/signing waits for a verified fork release channel.
name: Windows staging package
on:
  workflow_dispatch:
    inputs:
      offline_webview2:
        description: Embed the WebView2 offline installer in the native package
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build content assets
        run: |
          npm run tiles:restore
          npm run scan:fingerprints
          npm run ocr:assets
      - name: Lint
        run: npm run lint
      - name: Third-party notices
        run: npm run notices
      - name: Prepare pinned native dependencies
        run: |
          rustup show active-toolchain
          node scripts/native.mjs cargo fetch --locked
      - name: Build native staging installer
        if: ${{ !inputs.offline_webview2 }}
        run: npm run build:tauri -- --ci
        env:
          CARGO_BUILD_JOBS: '2'
      - name: Build native staging installer with offline WebView2
        if: ${{ inputs.offline_webview2 }}
        run: npm run build:tauri:offline
        env:
          CARGO_BUILD_JOBS: '2'
      - name: Upload native staging installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tarkov-companion-rust-native-windows-staging-${{ inputs.offline_webview2 && 'offline-webview2' || 'bootstrapper' }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload staging artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tarkov-companion-rust-windows-staging
          path: |
            release-packs/*.tcpack
          if-no-files-found: error
