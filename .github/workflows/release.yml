# Staging only: publishing/signing waits for a verified fork release channel.
name: Windows staging package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build content assets
        run: |
          npm run tiles:fetch
          npm run tiles:lighthouse
          npm run scan:fingerprints
          npm run ocr:assets
      - name: Lint
        run: npm run lint
      - name: Third-party notices
        run: npm run notices
      - name: Build isolated fork packages
        run: npm run dist:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload staging artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tarkov-companion-rust-windows-staging
          path: |
            release/TarkovCompanionRust-*.exe
            release-packs/*.tcpack
          if-no-files-found: error
